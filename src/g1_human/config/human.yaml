g1_human_node:
  ros__parameters:
    # Human pelvis pose in the world frame
    # Position [m]
    human_x: 0.5
    human_y: 0.0
    human_z: 0.784202
    # Orientation as RPY [rad]
    human_roll: 0.0
    human_pitch: 0.0
    human_yaw: 0.0

    # Publish rate [Hz]
    rate: 50.0
    publish_viz: true
    collision_geometry: "capsules"  # match params.yaml: 'capsules', 'spheres', or 'boxes'
    sphere_interpolation_level: 0
    sphere_radius_gain: 1.0
    human_radius_scale: 1.0

human_crowd_node:
  ros__parameters:
    # min_speed and max_speed are launch arguments of g1_human_crowd.launch.xml
    max_pause_sec: 2.0          # pause at each waypoint, uniform in [0, this]
    spawn_keepout_radius: 1.0    # nobody starts this close to the centre (the robot)
    rate: 30.0                   # /human/colliders [Hz]
    publish_viz: true
    marker_rate: 10.0            # /human/collider_markers [Hz]
    human_radius_scale: 1.0
