# G1 Joint Index Map (motor_state[i] / motor_cmd[i] in LowState/LowCmd)
#
#  0  left_hip_pitch          6  right_hip_pitch
#  1  left_hip_roll           7  right_hip_roll
#  2  left_hip_yaw            8  right_hip_yaw
#  3  left_knee               9  right_knee
#  4  left_ankle_pitch       10  right_ankle_pitch
#  5  left_ankle_roll        11  right_ankle_roll
#
# 12  waist_yaw
# 13  waist_roll           U
# 14  waist_pitch          U
#
# 15  left_shoulder_pitch  U  22  right_shoulder_pitch  U
# 16  left_shoulder_roll   U  23  right_shoulder_roll   U
# 17  left_shoulder_yaw        24  right_shoulder_yaw
# 18  left_elbow           U  25  right_elbow           U
# 19  left_wrist_roll          26  right_wrist_roll
# 20  left_wrist_pitch         27  right_wrist_pitch
# 21  left_wrist_yaw           28  right_wrist_yaw
#
# Lower-body policy controls joints 0..11.
# Waist and upper body are direct PD position targets via /joint_commands.
# U = upper-body command joints observed by the policy; waist_yaw is held fixed.

g1_rl_deploy_node:
  ros__parameters:
    model_path: /workspace/ros2_ws/install/g1_rl_deploy/share/g1_rl_deploy/models/policy.onnx

    # Timing
    control_dt: 0.02        # 50 Hz policy inference
    standup_duration: 3.0   # seconds to interpolate to trained default pose
    action_smoothing_alpha: 0.8  # trained range was 0.72..0.88

    # Default joint positions from Unitree-G1-LowerBody-Flat ONNX metadata.
    default_joint_pos: [-0.312, 0.0, 0.0, 0.669, -0.363, 0.0, # left leg
                        -0.312, 0.0, 0.0, 0.669, -0.363, 0.0, # right leg
                         0.0, 0.0, 0.0,                        # waist
                         0.2, 0.2, 0.0, 0.6, 0.0, 0.0, 0.0,    # left arm
                         0.2,-0.2, 0.0, 0.6, 0.0, 0.0, 0.0]    # right arm

    # Lower-body action scale only; the policy outputs 12 leg actions.
    action_scale: [0.70, 0.45, 0.30, 0.90, 0.55, 0.25,  # left leg
                   0.70, 0.45, 0.30, 0.90, 0.55, 0.25]  # right leg
