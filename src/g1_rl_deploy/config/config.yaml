# G1 Joint Index Map (motor_state[i] / motor_cmd[i] in LowState/LowCmd)
#
#  0  left_hip_pitch          6  right_hip_pitch
#  1  left_hip_roll           7  right_hip_roll
#  2  left_hip_yaw            8  right_hip_yaw
#  3  left_knee               9  right_knee
#  4  left_ankle_pitch       10  right_ankle_pitch
#  5  left_ankle_roll        11  right_ankle_roll
#
# 12  waist_yaw            C
# 13  waist_roll           C
# 14  waist_pitch          C
#
# 15  left_shoulder_pitch  C  22  right_shoulder_pitch  C
# 16  left_shoulder_roll   C  23  right_shoulder_roll   C
# 17  left_shoulder_yaw    C  24  right_shoulder_yaw    C
# 18  left_elbow           C  25  right_elbow           C
# 19  left_wrist_roll      P  26  right_wrist_roll      P
# 20  left_wrist_pitch     P  27  right_wrist_pitch     P
# 21  left_wrist_yaw       P  28  right_wrist_yaw       P
#
# The policy still outputs 29 actions, but g1_rl_deploy_node overrides
# C-marked non-wrist joints with CBF-filtered PD targets from
# /upper_body_targets when wbc=false. All 17 upper-body targets, including
# P-marked policy-owned wrists, are fed as observations in MJLab order.
# C = CBF/manual controlled (11), P = policy controlled but observed.

g1_rl_deploy_node:
  ros__parameters: 
    policy_type: mlp #mlp or gru_mlp
    policy_paths:
      mlp: /workspace/ros2_ws/install/g1_rl_deploy/share/g1_rl_deploy/models/mlp/policy.onnx
      gru_mlp: /workspace/ros2_ws/install/g1_rl_deploy/share/g1_rl_deploy/models/gru_mlp/policy.onnx

    # Timing
    control_dt: 0.02        # 50 Hz policy inference
    standup_duration: 3.0   # seconds to interpolate to home pose
    gait_period: 0.6        # phase oscillator period (seconds)
    wbc: false              # false preserves PD upper-body override

    # Velocity command limits
    cmd_vel_limits:
      lin_vel_x: [-1.0, 2.0]
      lin_vel_y: [-1.0, 1.0]
      ang_vel_z: [-1.0, 1.0]

    # Default joint positions (MJLab home pose) — all 29 DOF
    default_joint_pos: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,     # left leg
                        -0.1, 0.0, 0.0, 0.3, -0.2, 0.0,      # right leg
                         0.0, 0.0, 0.0,                        # waist
                         0.35, 0.18, 0.0, 0.87, 0.0, 0.0, 0.0, # left arm
                         0.35,-0.18, 0.0, 0.87, 0.0, 0.0, 0.0] # right arm

    # Per-joint action scale for the 29-output MJLab policy.
    action_scale: [0.5475464630, 0.3506614664, 0.5475464630, 0.3506614664, 0.4385773139, 0.4385773139,   # left leg
                   0.5475464630, 0.3506614664, 0.5475464630, 0.3506614664, 0.4385773139, 0.4385773139,   # right leg
                   0.5475464630, 0.2500000000, 0.2500000000,                                             # waist
                   0.4385773139, 0.4385773139, 0.4385773139, 0.4385773139, 0.4385773139, 0.0745008703, 0.0745008703, # left arm
                   0.4385773139, 0.4385773139, 0.4385773139, 0.4385773139, 0.4385773139, 0.0745008703, 0.0745008703] # right arm
