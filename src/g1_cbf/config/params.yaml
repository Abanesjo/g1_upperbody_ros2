g1_cbf_node:
  ros__parameters:
    dt: 0.01
    internal_margin_phi: 0.05  # [m], minimum clearance margin for self-collision
    external_margin_phi: 0.15  # [m], minimum clearance margin for human-robot collision
    internal_gamma: 4.0        # CBF gain for self-collision
    external_gamma: 4.0        # CBF gain for human-robot collision
    K: 10.0           # proportional speed gain
    max_velocity: 2.0  # rad/s velocity limit
    max_lead: 1.5        # max distance (rad) target can lead actual position
    lpf_gain: 0.0     # low-pass filter on desired position (0 = off)
    evaluate_at_actual: true  # true: barriers at actual state, false: barriers at target
    collision_geometry: "capsules"  # 'capsules' or 'spheres'
    sphere_interpolation_level: 0   # extra spheres between each base pair (spheres mode)
    sphere_radius_gain: 1.0         # radius scaling (spheres mode)
    max_iter: 200     # QP solver max iterations
    solver_tol: 0.001   # QP solver convergence tolerance (KKT residual)
    # Human capsule dimensions (order: torso, L/R arm, L/R shoulder, L/R thigh_ext, L/R shin)
    human_half_lengths: [0.33, 0.20, 0.20, 0.145, 0.145, 0.225, 0.225, 0.225, 0.225]
    human_radii: [0.10, 0.05, 0.05, 0.05, 0.05, 0.065, 0.065, 0.065, 0.065]
    human_radius_scale: 1.5
    external_filter_enabled: false
    external_activation_distance: 0.35
    external_max_active_pairs: 16
    external_always_keep_nearest: 4
    internal_filter_enabled: false
    internal_activation_distance: 0.20
    internal_max_active_pairs: 48
    internal_always_keep_nearest: 12
    area_cbf: true
    head_circle_cbf_enabled: true
    head_collider_radius: 0.1
    world_circle_radius: 3.0

g1_cbf_viz_node:
  ros__parameters:
    publish_viz: false
    viz_rate: 100.0
    collision_geometry: "capsules"
    sphere_interpolation_level: 1
    sphere_radius_gain: 1.0
    head_collider_radius: 0.15

cmd_vel_cbf_node:
  ros__parameters:
    dt: 0.02
    area_cbf: true
    cmd_vel_cbf_enabled: true
    external_margin_phi: 0.15
    external_gamma: 4.0
    head_collider_radius: 0.15
    world_circle_radius: 3.0
    cmd_vel_limits:
      lin_vel_x: [-0.5, 1.0]
      lin_vel_y: [-0.5, 0.5]
    state_timeout_sec: 0.2
    max_iter: 200
    solver_tol: 0.001

origin_cmd_vel_publisher_node:
  ros__parameters:
    rate_hz: 50.0
    target_x: 0.0
    target_y: 0.0
    target_yaw: 0.0
    kp_linear: 0.5
    kd_linear: 0.05
    kp_yaw: 1.0
    kd_yaw: 0.05
    position_deadzone: 0.1
    yaw_deadzone_deg: 15.0
    max_linear_x: 1.0
    max_reverse_x: 0.5
    max_linear_y: 0.5
    max_angular_z: 1.0
    pose_timeout_sec: 0.2

pelvis_circle_publisher_node:
  ros__parameters:
    world_circle_radius: 3.0
    height: 0.5
